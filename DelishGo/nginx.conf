events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Cabeceras globales de CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location /api/v1/productos {
            proxy_pass http://delishgo_producto-mscv:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/clientes {
            proxy_pass http://delishgo_cliente-mscv:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/restaurantes {
            proxy_pass http://delishgo_restaurant-mscv:8085; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/pedidos {
            proxy_pass http://delishgo_pedido-mscv:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}